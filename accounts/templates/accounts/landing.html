
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#ffffff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#111827;
}

.login-card{
    width:100%;
    max-width:400px;
    padding:40px;
    text-align:center;
}

.logo{
    width:56px;
    height:56px;
    border-radius:16px;
    background:#111827;
    margin:0 auto 24px;
}

h1{
    font-size:32px;
    font-weight:600;
    margin-bottom:8px;
}

.subtitle{
    color:#6b7280;
    margin-bottom:32px;
}

.google-btn{
    width:100%;
    height:48px;
    border:1px solid #e5e7eb;
    background:#fff;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    transition:.2s;
}

.google-btn:hover{
    background:#f9fafb;
    border-color:#d1d5db;
}

.google-icon{
    width:20px;
    height:20px;
}

.footer{
    margin-top:24px;
    font-size:13px;
    color:#9ca3af;
}
</style>
</head>

<body>

<div class="login-card">

    

    <h1>Welcome</h1>

    <p class="subtitle">
        Continue to chat
    </p>

    <button class="google-btn" onclick="window.location.href='/accounts/google/login/'">

        <svg class="google-icon" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12S17.4 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15 18.9 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.2-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.3 5.5-6.1 7.2l6.2 5.2C39 37.2 44 31.2 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>

        Continue with Google

    </button>

    <div class="footer">
        By continuing, you agree to our Terms & Privacy Policy
    </div>

</div>

</body>
</html>
