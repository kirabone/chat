<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    background:#ece5dd;
}

.sidebar{
    width:300px;
    background:white;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.search-box{
    padding:15px;
    border:none;
    border-bottom:1px solid #ddd;
    outline:none;
    font-size:16px;
}

.user-list{
    flex:1;
    overflow-y:auto;
}

.user{
    padding:15px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

.user:hover{
    background:#f5f5f5;
}

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

.chat-header{
    background:#075e54;
    color:white;
    padding:15px;
    font-weight:bold;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.message{
    padding:10px 15px;
    border-radius:10px;
    max-width:60%;
    word-break:break-word;
}

.sent{
    align-self:flex-end;
    background:#dcf8c6;
}

.received{
    align-self:flex-start;
    background:white;
}

.send-bar{
    display:flex;
    gap:10px;
    padding:10px;
    background:white;
    border-top:1px solid #ddd;
}

.send-bar input{
    flex:1;
    padding:10px;
}

.send-bar button{
    padding:10px 20px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">

    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Search users..."
    >

    <div
        id="userList"
        class="user-list">
    </div>

</div>

<div class="chat">

    <div
        id="chatHeader"
        class="chat-header">
        Select a user
    </div>

    <div
        id="messages"
        class="messages">
    </div>

    <div class="send-bar">

        <input
            type="text"
            id="messageInput"
            placeholder="Type message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

let currentUser = null;

function getCookie(name)
{
    let cookieValue = null;

    if(document.cookie)
    {
        const cookies = document.cookie.split(';');

        for(let cookie of cookies)
        {
            cookie = cookie.trim();

            if(cookie.startsWith(name + '='))
            {
                cookieValue = decodeURIComponent(
                    cookie.substring(name.length + 1)
                );
                break;
            }
        }
    }

    return cookieValue;
}

const csrftoken = getCookie("csrftoken");


async function searchUsers(query)
{
    if(!query.trim())
    {
        document.getElementById("userList").innerHTML = "";
        return;
    }

    const response = await fetch(
        `/chat/search/${query}/`
    );

    const users = await response.json();

    const userList =
        document.getElementById("userList");

    userList.innerHTML = "";

    users.forEach(user =>
    {
        const div =
            document.createElement("div");

        div.className = "user";
        div.innerText = user.username;

        div.onclick = () =>
        {
            currentUser = user.username;

            document
            .getElementById("chatHeader")
            .innerText = user.username;

            loadMessages();
        };

        userList.appendChild(div);
    });
}


async function loadMessages()
{
    if(!currentUser)
        return;

    const response = await fetch(
        `/chat/recv/${currentUser}/`
    );

    const messages =
        await response.json();

    const container =
        document.getElementById("messages");

    container.innerHTML = "";

    messages.forEach(msg =>
    {
        const div =
            document.createElement("div");

        div.classList.add("message");

        if(msg.sender === currentUser)
        {
            div.classList.add("received");
        }
        else
        {
            div.classList.add("sent");
        }

        div.innerText = msg.message;

        container.appendChild(div);
    });

    container.scrollTop =
        container.scrollHeight;
}


async function sendMessage()
{
    if(!currentUser)
        return;

    const input =
        document.getElementById("messageInput");

    const message =
        input.value.trim();

    if(!message)
        return;

    await fetch(
        `/chat/send/${currentUser}/`,
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "X-CSRFToken":csrftoken
            },

            body:JSON.stringify({
                message:message
            })
        }
    );

    input.value = "";

    loadMessages();
}


document
.getElementById("searchInput")
.addEventListener(
    "input",
    function()
    {
        searchUsers(this.value);
    }
);


document
.getElementById("messageInput")
.addEventListener(
    "keydown",
    function(e)
    {
        if(e.key === "Enter")
        {
            sendMessage();
        }
    }
);


setInterval(
    loadMessages,
    1000
);

</script>

</body>
</html>
